<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITEM Studio V1.3</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#17191f;--muted:#687083;--line:#e4e8ef;--accent:#111827;--soft:#eef2f7;--ok:#087a43;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1160px;margin:28px auto;padding:0 18px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:18px}h1{margin:0;font-size:30px}.sub{color:var(--muted);margin-top:7px}.version{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(17,24,39,.05)}
.notice{background:#fff8e7;border:1px solid #f3d58b;border-radius:12px;padding:12px 13px;font-size:13px;line-height:1.5;color:#73510a;margin-bottom:12px}
label{font-size:13px;font-weight:700;display:block;margin:14px 0 7px}input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:15px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff;width:100%;margin-top:15px}.videoBtn{background:#0f766e;color:#fff}.secondary{background:var(--soft);color:#222}.mini{padding:8px 11px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.quick{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted);margin-top:10px}.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.hidden{display:none}
.preview{aspect-ratio:9/16;background:linear-gradient(180deg,#0f172a,#334155);border-radius:18px;color:#fff;padding:28px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.badge{font-size:12px;border:1px solid rgba(255,255,255,.35);display:inline-block;padding:6px 9px;border-radius:99px}.hook{font-size:33px;font-weight:900;line-height:1.18;margin-top:24px}.product{font-size:19px;line-height:1.45;font-weight:700}.points{font-size:14px;line-height:1.6;color:#dbe7f5;white-space:pre-line}.cta{background:#fff;color:#111827;padding:13px;border-radius:12px;font-weight:900;text-align:center}
.out{margin-top:18px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 7px}.section-head h3{margin:0;font-size:16px}.box{background:#f8f9fb;border:1px solid var(--line);padding:13px;border-radius:12px;white-space:pre-wrap;line-height:1.55}.videoBox{margin-top:16px;background:#0f172a;border-radius:16px;padding:12px}.videoBox video{width:100%;max-height:520px;border-radius:12px;background:#000}.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;width:0;background:#0f766e;transition:width .15s linear}
@media(max-width:880px){.grid{grid-template-columns:1fr}.preview{max-width:390px;margin:auto}.top{align-items:start;flex-direction:column}}@media(max-width:560px){.wrap{margin:18px auto;padding:0 12px}.card{padding:16px}.row{grid-template-columns:1fr}.actions,.quick{display:grid;grid-template-columns:1fr}.actions button,.quick button{width:100%}h1{font-size:26px}.hook{font-size:29px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>ITEM Studio V1.3</h1><div class="sub">쿠팡 상품 정보 → 쇼츠 문구 + 세로 영상 파일 생성</div></div><div class="version">GitHub Pages 브라우저 영상 렌더링</div></div>
<div class="grid"><section class="card">
<div class="notice">이번 버전부터 실제 20초 세로 영상을 브라우저에서 만듭니다. 현재 영상은 무음 WebM이며, 다음 단계에서 AI 음성과 상품 이미지를 연결합니다.</div>
<label>쿠팡 파트너스 링크</label><input id="link" value="https://link.coupang.com/a/fKy46H5hCu" inputmode="url">
<label>상품명</label><input id="name" placeholder="쿠팡 상품명을 붙여 넣으세요">
<div class="row"><div><label>주요 장점 1</label><input id="p1" placeholder="예: 설치가 간단함"></div><div><label>주요 장점 2</label><input id="p2" placeholder="예: 공간을 적게 차지함"></div></div>
<label>대상 고객</label><select id="aud"><option>생활용품을 찾는 사람</option><option>육아·가정용품을 찾는 부모</option><option>자취생</option><option>차량용품을 찾는 운전자</option><option>선물용 상품을 찾는 사람</option></select>
<div class="quick"><button class="secondary" onclick="sample()">샘플 자동 입력</button><button class="secondary" onclick="resetForm()">입력 초기화</button></div>
<button class="primary" onclick="generate()">쇼츠 구성 생성</button><div id="status" class="status">상품명을 입력하거나 샘플 자동 입력을 누르세요.</div>
<div id="results" class="out hidden">
<div class="section-head"><h3>20초 쇼츠 대본</h3><button class="secondary mini" onclick="copyOne('script')">대본 복사</button></div><div id="script" class="box"></div>
<div class="section-head"><h3>추천 제목</h3><button class="secondary mini" onclick="copyOne('titles')">제목 복사</button></div><div id="titles" class="box"></div>
<div class="section-head"><h3>설명문</h3><button class="secondary mini" onclick="copyOne('desc')">설명 복사</button></div><div id="desc" class="box"></div>
<div class="section-head"><h3>해시태그</h3><button class="secondary mini" onclick="copyOne('tags')">태그 복사</button></div><div id="tags" class="box"></div>
<div class="actions"><button class="videoBtn" id="makeVideoBtn" onclick="makeVideo()">20초 영상 만들기</button><button class="secondary" onclick="copyAll()">전체 결과 복사</button><button class="secondary" onclick="downloadTxt()">TXT 저장</button><button class="secondary" onclick="downloadPreview()">PNG 저장</button></div>
<div id="progressWrap" class="hidden"><div class="progress"><span id="progressBar"></span></div><div id="progressText" class="status">영상 준비 중</div></div>
<div id="videoBox" class="videoBox hidden"><video id="videoResult" controls playsinline></video><div class="actions"><button class="videoBtn" onclick="downloadVideo()">영상 파일 저장</button></div></div>
</div></section>
<aside class="card"><div class="preview"><div><span class="badge">오늘의 이뗌</span><div id="pvHook" class="hook">상품명을 넣고<br>생성해 보세요</div></div><div><div id="pvProduct" class="product">링크 하나로 쇼츠 구성안을 만듭니다.</div><div id="pvPoints" class="points"></div></div><div class="cta">상품 보러 가기 ↓</div></div></aside></div></div>
<canvas id="canvas" width="1080" height="1920" class="hidden"></canvas>
<script>
const $=id=>document.getElementById(id);const el={link:$('link'),name:$('name'),p1:$('p1'),p2:$('p2'),aud:$('aud'),status:$('status'),results:$('results'),script:$('script'),titles:$('titles'),desc:$('desc'),tags:$('tags'),pvHook:$('pvHook'),pvProduct:$('pvProduct'),pvPoints:$('pvPoints'),canvas:$('canvas'),progressWrap:$('progressWrap'),progressBar:$('progressBar'),progressText:$('progressText'),videoBox:$('videoBox'),videoResult:$('videoResult'),makeVideoBtn:$('makeVideoBtn')};let videoBlob=null;
function clean(v,f=''){return(v||'').trim()||f}function sample(){el.name.value='접이식 다용도 수납 카트';el.p1.value='필요할 때만 펼쳐 쓸 수 있고';el.p2.value='주방과 거실 어디서든 활용도가 높습니다';el.aud.value='생활용품을 찾는 사람';el.status.innerHTML='<span class="ok">샘플 입력 완료 — 쇼츠 구성 생성 버튼을 누르세요.</span>'}
function resetForm(){el.name.value='';el.p1.value='';el.p2.value='';el.aud.selectedIndex=0;el.results.classList.add('hidden');el.videoBox.classList.add('hidden');el.pvHook.innerHTML='상품명을 넣고<br>생성해 보세요';el.pvProduct.textContent='링크 하나로 쇼츠 구성안을 만듭니다.';el.pvPoints.textContent='';el.status.textContent='입력을 초기화했습니다.';videoBlob=null}
function generate(){const l=clean(el.link.value),n=clean(el.name.value);if(!/^https:\/\/(link\.)?coupang\.com\//.test(l)){el.status.innerHTML='<span class="bad">쿠팡 링크 형식을 확인하세요.</span>';return false}if(!n){el.status.innerHTML='<span class="bad">상품명을 입력해 주세요.</span>';return false}const a=el.aud.value,x=clean(el.p1.value,'사용이 간편하고'),y=clean(el.p2.value,'일상 활용도가 높습니다');el.script.textContent=`[0~2초] 이거 아직도 모르셨나요?\n[2~6초] ${n}, ${x}.\n[6~12초] 특히 ${a}에게 잘 맞고, ${y}.\n[12~17초] 불편했던 부분을 줄여주는 실용템입니다.\n[17~20초] 궁금하면 화면의 상품을 눌러 확인해 보세요.`;el.titles.textContent=[`${n}, 왜 이제 알았지?`,`요즘 이거 찾는 사람이 많은 이유`,`${a}이라면 한 번 볼 만한 아이템`,`써보면 바로 이해되는 생활템`,`불편함 줄여주는 오늘의 이뗌`].map((v,i)=>`${i+1}. ${v}`).join('\n');el.desc.textContent=`${n}의 핵심 포인트를 20초 안에 정리했습니다.\n\n${x}, ${y}.\n\n상품 확인: ${l}\n\n※ 이 게시물은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.`;el.tags.textContent='#쇼핑쇼츠 #쿠팡추천 #생활용품 #살림템 #가성비템 #추천템 #오늘의이뗌 #제품추천 #쇼핑정보 #쿠팡파트너스';el.pvHook.innerHTML='이거 아직도<br>모르셨나요?';el.pvProduct.textContent=n;el.pvPoints.textContent=`• ${x}\n• ${y}`;el.results.classList.remove('hidden');el.status.innerHTML='<span class="ok">PASS ✅ 구성 생성 완료 — 이제 영상 만들기를 누르세요.</span>';return true}
function allText(){return`대본\n${el.script.textContent}\n\n제목\n${el.titles.textContent}\n\n설명\n${el.desc.textContent}\n\n해시태그\n${el.tags.textContent}`}async function copyText(t){try{await navigator.clipboard.writeText(t);el.status.innerHTML='<span class="ok">복사 완료</span>'}catch{el.status.innerHTML='<span class="bad">복사가 차단되었습니다.</span>'}}function copyOne(id){copyText($(id).textContent)}function copyAll(){copyText(allText())}
function downloadTxt(){const b=new Blob([allText()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='item-studio-result.txt';a.click();URL.revokeObjectURL(a.href)}
function wrap(c,t,x,y,m,h,center=false){const chars=[...t];let line='',lines=[];for(const ch of chars){const q=line+ch;if(c.measureText(q).width>m&&line){lines.push(line);line=ch}else line=q}if(line)lines.push(line);lines.forEach((v,i)=>c.fillText(v,center?540:x,y+i*h));return lines.length}
function drawFrame(c,t){const n=clean(el.name.value,'오늘의 추천 상품'),x=clean(el.p1.value,'사용이 간편함'),y=clean(el.p2.value,'일상 활용도가 높음'),g=c.createLinearGradient(0,0,1080,1920);g.addColorStop(0,'#07111f');g.addColorStop(.55,'#17324d');g.addColorStop(1,'#0f766e');c.fillStyle=g;c.fillRect(0,0,1080,1920);for(let i=0;i<8;i++){c.fillStyle=`rgba(255,255,255,${.025+i*.004})`;c.beginPath();c.arc(140+i*145,220+(i%3)*360+Math.sin(t/700+i)*35,80+i*8,0,Math.PI*2);c.fill()}c.fillStyle='#fff';c.textAlign='left';c.font='700 42px Arial';c.fillText('오늘의 이뗌',80,120);let scene=0;if(t>=2000)scene=1;if(t>=6000)scene=2;if(t>=12000)scene=3;if(t>=17000)scene=4;c.globalAlpha=Math.min(1,(t-[0,2000,6000,12000,17000][scene])/500);c.textAlign='center';if(scene===0){c.font='900 92px Arial';wrap(c,'이거 아직도 모르셨나요?',80,560,900,116,true)}else if(scene===1){c.font='900 74px Arial';wrap(c,n,80,520,900,96,true);c.font='600 48px Arial';wrap(c,x,80,980,880,65,true)}else if(scene===2){c.font='900 70px Arial';wrap(c,'이런 분께 잘 맞아요',80,460,900,92,true);c.font='600 50px Arial';wrap(c,el.aud.value,80,780,860,70,true);c.font='600 44px Arial';wrap(c,y,80,1120,860,62,true)}else if(scene===3){c.font='900 74px Arial';wrap(c,'불편함을 줄여주는 실용템',80,560,900,96,true);c.font='600 44px Arial';wrap(c,n,80,1040,860,62,true)}else{c.font='900 82px Arial';wrap(c,'상품이 궁금하다면',80,500,900,104,true);c.fillStyle='#fff';c.fillRect(110,1280,860,140);c.fillStyle='#0f172a';c.font='900 52px Arial';c.fillText('상품 보러 가기 ↓',540,1370)}c.globalAlpha=1;c.fillStyle='rgba(255,255,255,.75)';c.fillRect(80,1800,920,8);c.fillStyle='#fff';c.fillRect(80,1800,920*Math.min(t/20000,1),8);c.textAlign='left'}
function downloadPreview(){const c=el.canvas.getContext('2d');drawFrame(c,6500);const a=document.createElement('a');a.download='shorts-preview-1080x1920.png';a.href=el.canvas.toDataURL('image/png');a.click()}
async function makeVideo(){if(!generate())return;if(!window.MediaRecorder||!el.canvas.captureStream){el.status.innerHTML='<span class="bad">현재 브라우저는 영상 생성을 지원하지 않습니다. Chrome 또는 Edge를 사용하세요.</span>';return}el.makeVideoBtn.disabled=true;el.progressWrap.classList.remove('hidden');el.videoBox.classList.add('hidden');el.progressBar.style.width='0%';const c=el.canvas.getContext('2d'),stream=el.canvas.captureStream(30),mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm',rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:5000000}),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{videoBlob=new Blob(chunks,{type:mime});el.videoResult.src=URL.createObjectURL(videoBlob);el.videoBox.classList.remove('hidden');el.progressText.innerHTML='<span class="ok">PASS ✅ 20초 세로 영상 생성 완료</span>';el.makeVideoBtn.disabled=false;el.videoBox.scrollIntoView({behavior:'smooth',block:'center'})};const start=performance.now();rec.start(250);function frame(now){const t=now-start;drawFrame(c,Math.min(t,20000));const pct=Math.min(100,t/200);el.progressBar.style.width=pct+'%';el.progressText.textContent=`영상 렌더링 중 ${Math.floor(pct)}%`;if(t<20000)requestAnimationFrame(frame);else rec.stop()}requestAnimationFrame(frame)}
function downloadVideo(){if(!videoBlob)return;const a=document.createElement('a');a.href=URL.createObjectURL(videoBlob);a.download='item-studio-shorts-1080x1920.webm';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
</script></body></html>
