<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITEM Studio V1.2</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#17191f;--muted:#687083;--line:#e4e8ef;--accent:#111827;--soft:#eef2f7;--ok:#087a43;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1120px;margin:32px auto;padding:0 18px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:18px}h1{margin:0;font-size:30px}.sub{color:var(--muted);margin-top:7px}.version{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(17,24,39,.05)}
.notice{background:#fff8e7;border:1px solid #f3d58b;border-radius:12px;padding:12px 13px;font-size:13px;line-height:1.5;color:#73510a;margin-bottom:12px}
label{font-size:13px;font-weight:700;display:block;margin:14px 0 7px}input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:15px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff;width:100%;margin-top:15px}.secondary{background:var(--soft);color:#222}.mini{padding:8px 11px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.quick{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted);margin-top:10px}.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.hidden{display:none}
.preview{aspect-ratio:9/16;background:linear-gradient(180deg,#0f172a,#334155);border-radius:18px;color:#fff;padding:28px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:sticky;top:18px}.badge{font-size:12px;border:1px solid rgba(255,255,255,.35);display:inline-block;padding:6px 9px;border-radius:99px}.hook{font-size:33px;font-weight:900;line-height:1.18;margin-top:24px}.product{font-size:19px;line-height:1.45;font-weight:700}.points{font-size:14px;line-height:1.6;color:#dbe7f5}.cta{background:#fff;color:#111827;padding:13px;border-radius:12px;font-weight:900;text-align:center}
.out{margin-top:18px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 7px}.section-head h3{margin:0;font-size:16px}.box{background:#f8f9fb;border:1px solid var(--line);padding:13px;border-radius:12px;white-space:pre-wrap;line-height:1.55}
@media(max-width:860px){.grid{grid-template-columns:1fr}.preview{max-width:380px;margin:auto;position:static}.top{align-items:start;flex-direction:column}}
@media(max-width:560px){.wrap{margin:18px auto;padding:0 12px}.card{padding:16px}.row{grid-template-columns:1fr}.actions,.quick{display:grid;grid-template-columns:1fr}.actions button,.quick button{width:100%}h1{font-size:26px}.hook{font-size:29px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>ITEM Studio V1.2</h1><div class="sub">쿠팡 링크와 핵심 정보 입력 → 쇼츠 대본·제목·설명·해시태그·화면 시안 생성</div></div><div class="version">GitHub Pages 실시간 운영 테스트</div></div>
<div class="grid">
<section class="card">
<div class="notice">현재 GitHub Pages는 서버가 없는 정적 페이지이므로 쿠팡 상품정보 자동 수집은 하지 않습니다. 상품명과 장점만 넣으면 나머지는 즉시 생성됩니다.</div>
<label>쿠팡 파트너스 링크</label><input id="link" value="https://link.coupang.com/a/fKy46H5hCu" inputmode="url">
<label>상품명</label><input id="name" placeholder="쿠팡 상품명을 붙여 넣으세요">
<div class="row"><div><label>주요 장점 1</label><input id="p1" placeholder="예: 설치가 간단함"></div><div><label>주요 장점 2</label><input id="p2" placeholder="예: 공간을 적게 차지함"></div></div>
<label>대상 고객</label><select id="aud"><option>생활용품을 찾는 사람</option><option>육아·가정용품을 찾는 부모</option><option>자취생</option><option>차량용품을 찾는 운전자</option><option>선물용 상품을 찾는 사람</option></select>
<div class="quick"><button class="secondary" onclick="sample()">샘플 자동 입력</button><button class="secondary" onclick="resetForm()">입력 초기화</button></div>
<button class="primary" onclick="generate()">쇼츠 생성</button><div id="status" class="status">상품명을 입력하거나 샘플 자동 입력을 누르세요.</div>
<div id="results" class="out hidden">
<div class="section-head"><h3>20초 쇼츠 대본</h3><button class="secondary mini" onclick="copyOne('script')">대본 복사</button></div><div id="script" class="box"></div>
<div class="section-head"><h3>추천 제목</h3><button class="secondary mini" onclick="copyOne('titles')">제목 복사</button></div><div id="titles" class="box"></div>
<div class="section-head"><h3>설명문</h3><button class="secondary mini" onclick="copyOne('desc')">설명 복사</button></div><div id="desc" class="box"></div>
<div class="section-head"><h3>해시태그</h3><button class="secondary mini" onclick="copyOne('tags')">태그 복사</button></div><div id="tags" class="box"></div>
<div class="actions"><button class="secondary" onclick="copyAll()">전체 결과 복사</button><button class="secondary" onclick="downloadTxt()">TXT 저장</button><button class="secondary" onclick="downloadPreview()">1080×1920 PNG 저장</button></div>
</div>
</section>
<aside class="card"><div class="preview"><div><span class="badge">오늘의 이뗌</span><div id="pvHook" class="hook">상품명을 넣고<br>생성해 보세요</div></div><div><div id="pvProduct" class="product">링크 하나로 쇼츠 구성안을 만듭니다.</div><div id="pvPoints" class="points"></div></div><div class="cta">상품 보러 가기 ↓</div></div></aside>
</div></div><canvas id="canvas" width="1080" height="1920" class="hidden"></canvas>
<script>
const $=id=>document.getElementById(id);const el={link:$('link'),name:$('name'),p1:$('p1'),p2:$('p2'),aud:$('aud'),status:$('status'),results:$('results'),script:$('script'),titles:$('titles'),desc:$('desc'),tags:$('tags'),pvHook:$('pvHook'),pvProduct:$('pvProduct'),pvPoints:$('pvPoints'),canvas:$('canvas')};
function clean(v,f=''){return(v||'').trim()||f}
function sample(){el.name.value='접이식 다용도 수납 카트';el.p1.value='필요할 때만 펼쳐 쓸 수 있고';el.p2.value='주방과 거실 어디서든 활용도가 높습니다';el.aud.value='생활용품을 찾는 사람';el.status.innerHTML='<span class="ok">샘플 입력 완료 — 쇼츠 생성 버튼을 누르세요.</span>'}
function resetForm(){el.name.value='';el.p1.value='';el.p2.value='';el.aud.selectedIndex=0;el.results.classList.add('hidden');el.pvHook.innerHTML='상품명을 넣고<br>생성해 보세요';el.pvProduct.textContent='링크 하나로 쇼츠 구성안을 만듭니다.';el.pvPoints.textContent='';el.status.textContent='입력을 초기화했습니다.'}
function generate(){const l=clean(el.link.value),n=clean(el.name.value);if(!/^https:\/\/(link\.)?coupang\.com\//.test(l)){el.status.innerHTML='<span class="bad">쿠팡 링크 형식을 확인하세요.</span>';return}if(!n){el.status.innerHTML='<span class="bad">상품명을 입력해 주세요.</span>';return}const a=el.aud.value,x=clean(el.p1.value,'사용이 간편하고'),y=clean(el.p2.value,'일상 활용도가 높습니다');const hook='이거 아직도 모르셨나요?';el.script.textContent=`[0~2초] ${hook}\n[2~6초] ${n}, ${x}.\n[6~12초] 특히 ${a}에게 잘 맞고, ${y}.\n[12~17초] 불편했던 부분을 줄여주는 실용템입니다.\n[17~20초] 궁금하면 화면의 상품을 눌러 확인해 보세요.`;el.titles.textContent=[`${n}, 왜 이제 알았지?`,`요즘 이거 찾는 사람이 많은 이유`,`${a}이라면 한 번 볼 만한 아이템`,`써보면 바로 이해되는 생활템`,`불편함 줄여주는 오늘의 이뗌`].map((v,i)=>`${i+1}. ${v}`).join('\n');el.desc.textContent=`${n}의 핵심 포인트를 20초 안에 정리했습니다.\n\n${x}, ${y}.\n\n상품 확인: ${l}\n\n※ 이 게시물은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.`;el.tags.textContent='#쇼핑쇼츠 #쿠팡추천 #생활용품 #살림템 #가성비템 #추천템 #오늘의이뗌 #제품추천 #쇼핑정보 #쿠팡파트너스';el.pvHook.innerHTML='이거 아직도<br>모르셨나요?';el.pvProduct.textContent=n;el.pvPoints.textContent=`• ${x}\n• ${y}`;el.results.classList.remove('hidden');el.status.innerHTML='<span class="ok">PASS ✅ 대본·제목·설명·태그·시안 생성 완료</span>';el.results.scrollIntoView({behavior:'smooth',block:'start'})}
function allText(){return`대본\n${el.script.textContent}\n\n제목\n${el.titles.textContent}\n\n설명\n${el.desc.textContent}\n\n해시태그\n${el.tags.textContent}`}
async function copyText(t){try{await navigator.clipboard.writeText(t);el.status.innerHTML='<span class="ok">복사 완료</span>'}catch{el.status.innerHTML='<span class="bad">브라우저에서 복사가 차단되었습니다.</span>'}}
function copyOne(id){copyText($(id).textContent)}function copyAll(){copyText(allText())}
function downloadTxt(){const b=new Blob([allText()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='item-studio-result.txt';a.click();URL.revokeObjectURL(a.href)}
function wrap(c,t,x,y,m,h){const w=t.split(' ');let l='',r=[];for(const v of w){const q=l+v+' ';if(c.measureText(q).width>m&&l){r.push(l);l=v+' '}else l=q}r.push(l);r.forEach((v,i)=>c.fillText(v.trim(),x,y+i*h));return y+r.length*h}
function downloadPreview(){const n=clean(el.name.value,'오늘의 추천 상품'),x=clean(el.p1.value,'사용이 간편함'),y=clean(el.p2.value,'일상 활용도가 높음'),c=el.canvas.getContext('2d'),g=c.createLinearGradient(0,0,0,1920);g.addColorStop(0,'#0f172a');g.addColorStop(1,'#334155');c.fillStyle=g;c.fillRect(0,0,1080,1920);c.fillStyle='#fff';c.font='700 42px Arial';c.fillText('오늘의 이뗌',80,120);c.font='900 92px Arial';wrap(c,'이거 아직도 모르셨나요?',80,390,920,115);c.font='700 54px Arial';wrap(c,n,80,1090,920,72);c.font='500 38px Arial';wrap(c,'• '+x,80,1320,920,54);wrap(c,'• '+y,80,1440,920,54);c.fillStyle='#fff';c.fillRect(80,1660,920,120);c.fillStyle='#111827';c.font='900 46px Arial';c.textAlign='center';c.fillText('상품 보러 가기 ↓',540,1738);c.textAlign='left';const a=document.createElement('a');a.download='shorts-preview-1080x1920.png';a.href=el.canvas.toDataURL('image/png');a.click()}
</script></body></html>
