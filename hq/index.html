<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITEM Studio</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--line:#e1e6ef;--text:#172033;--muted:#748096;--nav:#111827;--nav2:#1f2937;--accent:#ffca32;--green:#148a55;--shadow:0 10px 28px rgba(17,24,39,.06)}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}.app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,var(--nav),#0b1220);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:11px;align-items:center;padding:2px 8px 24px}.logo{width:42px;height:42px;border-radius:13px;background:var(--accent);color:#111827;display:grid;place-items:center;font-weight:900}.brand strong,.brand small{display:block}.brand small{color:#9ca3af;margin-top:3px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#aab2c2;padding:12px 14px;border-radius:11px;text-align:left;font-weight:800;cursor:pointer}.nav button:hover,.nav button.active{background:var(--nav2);color:#fff}.nav button.active{box-shadow:inset 3px 0 0 var(--accent)}.side-foot{position:absolute;left:18px;right:18px;bottom:18px;color:#9ca3af;font-size:12px}.main{padding:28px 32px 60px;min-width:0}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:29px}.top p{margin:7px 0 0;color:var(--muted)}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:900;cursor:pointer}.btn.primary{background:var(--accent);color:#111827}.btn.secondary{background:#fff;border:1px solid var(--line)}.btn.dark{background:#172033;color:#fff}.screen{display:none}.screen.active{display:block}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.search-panel{padding:24px}.search-panel h2{margin:0 0 7px}.search-panel p{margin:0 0 18px;color:var(--muted)}.search-row{display:grid;grid-template-columns:1fr auto;gap:10px}.search-row input{width:100%;border:1px solid var(--line);background:#fbfcff;border-radius:13px;padding:15px;outline:none;font-size:16px}.hint{margin-top:10px;color:var(--muted);font-size:13px}.progress{display:none;margin-top:16px}.progress.show{display:block}.progress-list{display:grid;gap:8px}.progress-item{display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:12px;background:#f8fafc;color:#647087}.progress-item.done{color:var(--green);background:#eefaf4}.progress-item.active{color:#172033;background:#fff6d0}.dot{width:9px;height:9px;border-radius:50%;background:currentColor}.result-wrap{display:none;margin-top:16px}.result-wrap.show{display:block}.summary{display:grid;grid-template-columns:1.2fr .8fr;gap:15px;margin-bottom:15px}.product-card h2{margin:0 0 8px}.product-card p{color:var(--muted);line-height:1.6;margin:0}.scene-list{display:grid;gap:8px;margin-top:12px}.scene{padding:11px 12px;background:#f8fafc;border-radius:11px}.script-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.script-head h2{margin:0}.script-tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}.tab.active{background:#172033;color:#fff;border-color:#172033}.script-box{border:1px solid var(--line);border-radius:15px;overflow:hidden}.script-label{padding:12px 14px;background:#fafbfe;border-bottom:1px solid var(--line);font-weight:900}.script-box textarea{display:block;width:100%;min-height:300px;border:0;padding:20px;resize:vertical;line-height:1.8;outline:none;font-size:16px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.saved-list{display:grid;gap:10px}.saved-item{padding:14px;border:1px solid var(--line);border-radius:13px;background:#fff;cursor:pointer}.saved-item strong,.saved-item small{display:block}.saved-item small{color:var(--muted);margin-top:5px}.empty{text-align:center;padding:42px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.toast{position:fixed;right:22px;bottom:22px;background:#111827;color:#fff;padding:13px 16px;border-radius:11px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:900px){.summary{grid-template-columns:1fr}}@media(max-width:720px){.app{display:block}.side{height:auto;position:relative}.side-foot{display:none}.nav{grid-template-columns:1fr 1fr}.main{padding:18px}.search-row{grid-template-columns:1fr}.top{align-items:flex-start}.script-head{display:block}.script-tabs{margin-top:12px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="logo">IS</div><div><strong>ITEM Studio</strong><small>콘텐츠 작업실</small></div></div>
  <nav class="nav">
    <button class="active" data-screen="make">새 콘텐츠 만들기</button>
    <button data-screen="saved">저장한 콘텐츠</button>
  </nav>
  <div class="side-foot">상품 하나로 대본까지 한 번에</div>
</aside>
<main class="main">
<header class="top"><div><h1 id="pageTitle">새 콘텐츠 만들기</h1><p id="pageDesc">상품명이나 상품 링크만 입력하세요.</p></div></header>
<section class="screen active" id="make">
  <div class="panel search-panel">
    <h2>어떤 상품으로 만들까요?</h2>
    <p>상품명 또는 판매 페이지 주소를 붙여 넣으면 됩니다.</p>
    <div class="search-row"><input id="productInput" placeholder="예: 알리사 100단 아이스 터보 MAX 선풍기 또는 상품 링크"><button class="btn primary" id="makeBtn">한 번에 만들기</button></div>
    <div class="hint">나머지 내용은 작업실이 정리하고, 사용자는 완성된 대본만 고르면 됩니다.</div>
    <div class="progress" id="progress"><div class="progress-list" id="progressList"></div></div>
  </div>
  <div class="result-wrap" id="resultWrap">
    <div class="summary">
      <div class="panel product-card"><h2 id="productTitle"></h2><p id="productSummary"></p></div>
      <div class="panel"><strong>이 상품을 찾는 사람의 실제 상황</strong><div class="scene-list" id="sceneList"></div></div>
    </div>
    <div class="panel">
      <div class="script-head"><h2>완성된 대본</h2><div class="script-tabs" id="scriptTabs"></div></div>
      <div class="script-box"><div class="script-label" id="scriptLabel">추천 대본</div><textarea id="scriptText"></textarea></div>
      <div class="actions"><button class="btn primary" id="copyBtn">대본 복사</button><button class="btn secondary" id="changeBtn">다른 내용으로 다시 만들기</button><button class="btn dark" id="saveBtn">저장하기</button></div>
    </div>
  </div>
</section>
<section class="screen" id="saved"><div class="panel"><h2>저장한 콘텐츠</h2><div class="saved-list" id="savedList"></div></div></section>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const state={product:'',scripts:[],active:0};
function say(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1800)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function detect(name){const text=name.toLowerCase();if(/선풍기|써큘|냉풍/.test(text))return{kind:'선풍기',summary:'더운 공간에서 바람이 필요한 순간을 중심으로, 제품 설명보다 실제 사용 장면이 먼저 보이도록 구성했습니다.',scenes:['에어컨을 켰는데도 방 안 공기가 답답할 때','요리하거나 화장할 때 얼굴로 열기가 몰릴 때','잠들기 전 강한 바람보다 세밀한 바람 조절이 필요할 때'],hooks:['에어컨을 켰는데도 방 안이 답답한 이유, 바람이 약해서가 아닐 수 있습니다.','선풍기 한 대를 사더라도 저는 바람 세기보다 이 장면부터 봅니다.','요리할 때마다 주방이 찜통이 된다면 이 방식이 더 현실적입니다.']};if(/청소기|흡입/.test(text))return{kind:'청소기',summary:'큰 청소기를 꺼내기 애매한 순간과 틈새 청소의 번거로움을 중심으로 대본을 만들었습니다.',scenes:['차량 시트 틈에 과자 부스러기가 들어갔을 때','책상과 키보드 주변 먼지만 빠르게 치우고 싶을 때','큰 청소기를 꺼내고 정리하는 일이 더 번거로울 때'],hooks:['먼지보다 청소기 꺼내는 일이 더 귀찮았던 적 있으시죠?','차 안 과자 부스러기 때문에 세차장까지 갈 필요는 없습니다.','큰 청소기가 필요한 게 아니라 바로 꺼낼 수 있는 청소기가 필요했습니다.']};return{kind:'생활용품',summary:'상품의 기능을 길게 설명하지 않고, 사람들이 실제로 필요를 느끼는 순간부터 시작하도록 구성했습니다.',scenes:['매번 같은 불편이 반복되는데 마땅한 해결 방법이 없을 때','사기 전에는 몰랐지만 생활 동선에서 자주 쓰게 되는 물건을 찾을 때','기능보다 실제로 얼마나 자주 꺼내 쓰는지가 중요한 상황'],hooks:[`${name}, 기능보다 먼저 봐야 할 건 따로 있습니다.`,`${name}이 필요한 순간은 생각보다 아주 일상적입니다.`,`이 제품을 살지 말지는 사용 장면 하나로 결정됩니다.`]}}
function buildScripts(name,info,shift=0){const h=info.hooks;const s=info.scenes;return[
{label:'가장 추천',text:`${h[(0+shift)%h.length]}\n\n폭염이 심한 날에는 에어컨을 켜도 공기가 한곳에 머물면 금방 답답해집니다.\n\n${name}은 이런 순간에 필요한 바람을 세밀하게 조절해 쓰는 제품입니다.\n\n특히 ${s[0]} 바로 꺼내 쓸 수 있다는 점이 핵심입니다.\n\n제품 이름보다 중요한 건 내 생활에서 자주 생기는 불편을 실제로 줄여주느냐입니다.`},
{label:'상황 공감형',text:`${h[(1+shift)%h.length]}\n\n${s[1]} 정말 불편합니다.\n\n이럴 때 필요한 건 거창한 기능이 아니라 원하는 위치에 필요한 만큼 바람을 보내는 것입니다.\n\n${name}은 그런 사용 장면에 맞춰 살펴볼 만한 제품입니다.\n\n내가 어디에서 가장 자주 쓸지만 정하면 선택은 훨씬 쉬워집니다.`},
{label:'빠른 쇼츠형',text:`${h[(2+shift)%h.length]}\n\n첫째, 내가 쓰는 장소에 놓기 편한지.\n둘째, 원하는 만큼 바람을 조절할 수 있는지.\n셋째, 자주 꺼내 써도 부담 없는지.\n\n${name}은 이 세 가지를 내 사용 장면에 맞춰 확인하면 됩니다.`},
{label:'사용 후기형',text:`처음에는 ${name}이 정말 필요한가 싶었습니다.\n\n그런데 ${s[2]} 생각보다 자주 손이 갔습니다.\n\n좋았던 점은 기능이 많다는 것보다 그때그때 필요한 만큼 바로 쓸 수 있다는 점이었습니다.\n\n생활용품은 한 번의 큰 변화보다 반복되는 작은 불편을 줄여줄 때 값어치를 합니다.`},
{label:'비교 선택형',text:`${name} 같은 제품을 고를 때 숫자만 비교하면 오히려 선택이 어려워집니다.\n\n저라면 바람 세기, 사용 장소, 보관 편의 순서로 봅니다.\n\n침실에서 쓸지, 책상에서 쓸지, 주방에서 쓸지에 따라 필요한 조건이 달라집니다.\n\n결국 가장 좋은 제품은 내 생활에서 가장 자주 꺼내 쓰게 되는 제품입니다.`}
]}
const steps=['상품을 확인하고 있습니다','사람들이 필요한 순간을 찾고 있습니다','말이 되는 내용만 골라내고 있습니다','서로 다른 대본을 만들고 있습니다','완성된 결과를 정리하고 있습니다'];
async function make(){const name=$('#productInput').value.trim();if(!name){say('상품명이나 링크를 입력하세요.');return}state.product=name;$('#progress').classList.add('show');$('#resultWrap').classList.remove('show');$('#progressList').innerHTML=steps.map((x,i)=>`<div class="progress-item" data-step="${i}"><i class="dot"></i>${x}</div>`).join('');for(let i=0;i<steps.length;i++){const items=$$('.progress-item');items.forEach((x,j)=>x.className='progress-item'+(j<i?' done':j===i?' active':''));await new Promise(r=>setTimeout(r,380))}$$('.progress-item').forEach(x=>x.className='progress-item done');const info=detect(name);state.scripts=buildScripts(name,info,0);state.active=0;$('#productTitle').textContent=name;$('#productSummary').textContent=info.summary;$('#sceneList').innerHTML=info.scenes.map(x=>`<div class="scene">${esc(x)}</div>`).join('');renderScripts();$('#resultWrap').classList.add('show');say('대본을 완성했습니다.')}
function renderScripts(){const tabs=$('#scriptTabs');tabs.innerHTML=state.scripts.map((s,i)=>`<button class="tab ${i===state.active?'active':''}" data-tab="${i}">${s.label}</button>`).join('');$('#scriptLabel').textContent=state.scripts[state.active].label;$('#scriptText').value=state.scripts[state.active].text;$$('[data-tab]').forEach(b=>b.onclick=()=>{state.scripts[state.active].text=$('#scriptText').value;state.active=+b.dataset.tab;renderScripts()})}
function store(){return JSON.parse(localStorage.getItem('itemStudioSaved')||'[]')}
function save(){if(!state.scripts.length){say('먼저 대본을 만드세요.');return}state.scripts[state.active].text=$('#scriptText').value;const arr=store();arr.unshift({id:Date.now(),product:state.product,scripts:state.scripts,date:new Date().toLocaleString('ko-KR')});localStorage.setItem('itemStudioSaved',JSON.stringify(arr.slice(0,50)));say('저장했습니다.')}
function renderSaved(){const arr=store(),root=$('#savedList');root.innerHTML=arr.length?arr.map((x,i)=>`<div class="saved-item" data-load="${i}"><strong>${esc(x.product)}</strong><small>${x.date} · 대본 ${x.scripts.length}개</small></div>`).join(''):'<div class="empty">저장한 콘텐츠가 없습니다.</div>';$$('[data-load]').forEach(x=>x.onclick=()=>{const p=arr[+x.dataset.load];state.product=p.product;state.scripts=p.scripts;state.active=0;$('#productInput').value=p.product;$('#productTitle').textContent=p.product;$('#productSummary').textContent='저장해 둔 대본을 다시 불러왔습니다.';$('#sceneList').innerHTML='';renderScripts();$('#resultWrap').classList.add('show');openScreen('make');say('저장한 콘텐츠를 불러왔습니다.')})}
function openScreen(id){$$('.screen').forEach(x=>x.classList.toggle('active',x.id===id));$$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.screen===id));$('#pageTitle').textContent=id==='make'?'새 콘텐츠 만들기':'저장한 콘텐츠';$('#pageDesc').textContent=id==='make'?'상품명이나 상품 링크만 입력하세요.':'필요한 대본을 다시 불러올 수 있습니다.';if(id==='saved')renderSaved()}
$$('.nav button').forEach(b=>b.onclick=()=>openScreen(b.dataset.screen));$('#makeBtn').onclick=make;$('#productInput').onkeydown=e=>{if(e.key==='Enter')make()};$('#copyBtn').onclick=()=>navigator.clipboard.writeText($('#scriptText').value).then(()=>say('대본을 복사했습니다.'));$('#saveBtn').onclick=save;$('#changeBtn').onclick=()=>{if(!state.product)return;const info=detect(state.product),shift=Math.floor(Math.random()*3);state.scripts=buildScripts(state.product,info,shift);state.active=0;renderScripts();say('다른 내용으로 다시 만들었습니다.')};
</script>
</body>
</html>
