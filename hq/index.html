<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITEM Studio</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--line:#e1e6ef;--text:#172033;--muted:#748096;--nav:#111827;--nav2:#1f2937;--accent:#ffca32;--green:#148a55;--shadow:0 10px 28px rgba(17,24,39,.06)}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}.app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,var(--nav),#0b1220);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:11px;align-items:center;padding:2px 8px 24px}.logo{width:42px;height:42px;border-radius:13px;background:var(--accent);color:#111827;display:grid;place-items:center;font-weight:900}.brand strong,.brand small{display:block}.brand small{color:#9ca3af;margin-top:3px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#aab2c2;padding:12px 14px;border-radius:11px;text-align:left;font-weight:800;cursor:pointer}.nav button:hover,.nav button.active{background:var(--nav2);color:#fff}.nav button.active{box-shadow:inset 3px 0 0 var(--accent)}.side-foot{position:absolute;left:18px;right:18px;bottom:18px;color:#9ca3af;font-size:12px}.main{padding:28px 32px 60px;min-width:0}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:29px}.top p{margin:7px 0 0;color:var(--muted)}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:900;cursor:pointer}.btn.primary{background:var(--accent);color:#111827}.btn.secondary{background:#fff;border:1px solid var(--line)}.btn.dark{background:#172033;color:#fff}.screen{display:none}.screen.active{display:block}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.search-panel{padding:24px}.search-panel h2{margin:0 0 7px}.search-panel p{margin:0 0 18px;color:var(--muted)}.search-row{display:grid;grid-template-columns:1fr auto;gap:10px}.search-row input{width:100%;border:1px solid var(--line);background:#fbfcff;border-radius:13px;padding:15px;outline:none;font-size:16px}.hint{margin-top:10px;color:var(--muted);font-size:13px}.progress{display:none;margin-top:16px}.progress.show{display:block}.progress-list{display:grid;gap:8px}.progress-item{display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:12px;background:#f8fafc;color:#647087}.progress-item.done{color:var(--green);background:#eefaf4}.progress-item.active{color:#172033;background:#fff6d0}.dot{width:9px;height:9px;border-radius:50%;background:currentColor}.result-wrap{display:none;margin-top:16px}.result-wrap.show{display:block}.summary{display:grid;grid-template-columns:1.2fr .8fr;gap:15px;margin-bottom:15px}.product-card h2{margin:0 0 8px}.product-card p{color:var(--muted);line-height:1.65;margin:0}.scene-list{display:grid;gap:8px;margin-top:12px}.scene{padding:11px 12px;background:#f8fafc;border-radius:11px}.script-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.script-head h2{margin:0}.script-tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}.tab.active{background:#172033;color:#fff;border-color:#172033}.script-box{border:1px solid var(--line);border-radius:15px;overflow:hidden}.script-label{padding:12px 14px;background:#fafbfe;border-bottom:1px solid var(--line);font-weight:900;display:flex;justify-content:space-between;gap:10px}.score{color:var(--green);font-size:13px}.script-box textarea{display:block;width:100%;min-height:390px;border:0;padding:20px;resize:vertical;line-height:1.75;outline:none;font-size:16px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.saved-list{display:grid;gap:10px}.saved-item{padding:14px;border:1px solid var(--line);border-radius:13px;background:#fff;cursor:pointer}.saved-item strong,.saved-item small{display:block}.saved-item small{color:var(--muted);margin-top:5px}.empty{text-align:center;padding:42px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.toast{position:fixed;right:22px;bottom:22px;background:#111827;color:#fff;padding:13px 16px;border-radius:11px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:900px){.summary{grid-template-columns:1fr}}@media(max-width:720px){.app{display:block}.side{height:auto;position:relative}.side-foot{display:none}.nav{grid-template-columns:1fr 1fr}.main{padding:18px}.search-row{grid-template-columns:1fr}.top{align-items:flex-start}.script-head{display:block}.script-tabs{margin-top:12px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="logo">IS</div><div><strong>ITEM Studio</strong><small>AI 판매 직원</small></div></div>
  <nav class="nav"><button class="active" data-screen="make">새 콘텐츠 만들기</button><button data-screen="saved">저장한 콘텐츠</button></nav>
  <div class="side-foot">설명하지 않고, 사고 싶게 만듭니다</div>
</aside>
<main class="main">
<header class="top"><div><h1 id="pageTitle">새 콘텐츠 만들기</h1><p id="pageDesc">상품명이나 상품 링크만 입력하세요.</p></div></header>
<section class="screen active" id="make">
  <div class="panel search-panel">
    <h2>어떤 상품을 팔까요?</h2>
    <p>상품명 또는 판매 페이지 주소를 붙여 넣으면 판매 흐름부터 대본까지 만듭니다.</p>
    <div class="search-row"><input id="productInput" placeholder="예: 냉각판 휴대용 선풍기 또는 상품 링크"><button class="btn primary" id="makeBtn">판매 콘텐츠 만들기</button></div>
    <div class="hint">상품 설명문이 아니라 쇼핑 쇼츠용 판매 대화를 생성합니다.</div>
    <div class="progress" id="progress"><div class="progress-list" id="progressList"></div></div>
  </div>
  <div class="result-wrap" id="resultWrap">
    <div class="summary">
      <div class="panel product-card"><h2 id="productTitle"></h2><p id="productSummary"></p></div>
      <div class="panel"><strong>판매 장면 설계</strong><div class="scene-list" id="sceneList"></div></div>
    </div>
    <div class="panel">
      <div class="script-head"><h2>완성된 판매 대본</h2><div class="script-tabs" id="scriptTabs"></div></div>
      <div class="script-box"><div class="script-label"><span id="scriptLabel">추천 대본</span><span class="score" id="revenueScore"></span></div><textarea id="scriptText"></textarea></div>
      <div class="actions"><button class="btn primary" id="copyBtn">대본 복사</button><button class="btn secondary" id="changeBtn">다른 내용으로 다시 만들기</button><button class="btn dark" id="saveBtn">저장하기</button></div>
    </div>
  </div>
</section>
<section class="screen" id="saved"><div class="panel"><h2>저장한 콘텐츠</h2><div class="saved-list" id="savedList"></div></div></section>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const state={product:'',scripts:[],active:0,analysis:null};
const FORBIDDEN=['안녕하세요','오늘 소개할 제품은','오늘 소개할 상품은','이 제품은','기능은','장점은','추천드립니다','도움이 되셨다면','구매해보세요','설명드리겠습니다'];
const VOICE_LOCK={name:'쇼핑 크리에이터',age:'20~30대',tone:'밝지만 과하지 않고 빠르며 리듬감 있는 대화체',style:'실제로 써본 사람이 친구에게 알려주는 느낌',forbidden:'AI 안내원·뉴스 진행자·교과서 낭독·과장된 홈쇼핑 아주머니·억지 텐션'};
function say(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1800)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function cleanScript(text){let out=String(text);FORBIDDEN.forEach(word=>{out=out.split(word).join('')});return out.replace(/\n{3,}/g,'\n\n').replace(/^\s*[,.~]+/gm,'').trim()}
function productResearch(name){const text=name.toLowerCase();
  if(/냉각|쿨링|아이스/.test(text)&&/선풍기|팬/.test(text))return{kind:'냉각 선풍기',dna:'바람보다 차가운 접촉감이 구매를 만드는 휴대용 냉각 도구',strength:'얼굴에 닿는 순간 체감되는 냉각판',problem:'폭염에 달아오른 얼굴과 무너지는 메이크업',buyer:'출퇴근·등하원·야외활동 중 얼굴 열기를 빠르게 식히고 싶은 사람',psychology:'바람 세기보다 즉시 느껴지는 차가움을 직접 확인하고 싶다',proof:'닿기 전과 닿은 뒤 표정 변화',scenes:['얼굴이 벌겋게 달아오른 장면','냉각판을 볼이나 목에 직접 대는 초근접 장면','닿는 순간 표정이 바뀌는 반응 장면'],hooks:['잠깐. 지금 표정 바뀌는 거 보이세요?','와... 선풍기가 아니라 얼굴 열기 끄는 버튼 같은데요?','아니 잠깐. 여기 딱 대는 순간이 진짜예요.']};
  if(/선풍기|써큘|냉풍|팬/.test(text))return{kind:'선풍기',dna:'더운 순간 바로 꺼내 쓰는 개인 바람 도구',strength:'필요한 위치에 즉시 보내는 바람',problem:'에어컨을 켜도 얼굴과 몸 주변에 남는 답답한 열기',buyer:'출퇴근·주방·책상·침실에서 빠르게 시원해지고 싶은 사람',psychology:'내가 가장 더운 순간에 실제로 도움이 되는지 보고 싶다',proof:'사용 전 답답한 표정과 사용 후 편안해진 표정',scenes:['더위에 지친 얼굴을 먼저 보여주는 장면','제품을 켜자 머리카락과 옷깃이 움직이는 장면','사용자가 안도하며 계속 쓰는 반응 장면'],hooks:['잠깐. 에어컨 켰는데도 얼굴만 뜨거운 분들 보세요.','와... 이래서 더운 날 손에서 안 놓는 거였네요.','아니, 바람 닿자마자 표정부터 달라지는데요?']};
  if(/청소기|흡입/.test(text))return{kind:'청소기',dna:'큰 청소기를 꺼내지 않고 눈앞의 지저분함을 바로 없애는 도구',strength:'보이는 순간 바로 처리하는 즉시성',problem:'차량 틈새·키보드·소파의 작은 부스러기 때문에 큰 청소기를 꺼내야 하는 번거로움',buyer:'작은 먼지와 부스러기를 미루지 않고 바로 치우고 싶은 사람',psychology:'꺼내기 쉽고 실제로 깨끗해지는 장면을 보고 싶다',proof:'흡입 전후가 한 화면에서 분명하게 달라지는 장면',scenes:['틈새 부스러기를 초근접으로 보여주는 장면','한 손으로 바로 흡입하는 장면','청소 전후를 나란히 비교하는 장면'],hooks:['잠깐. 이 작은 부스러기 때문에 큰 청소기 꺼내셨죠?','와... 한 번 지나갔는데 어디 갔어요?','아니, 청소보다 청소기 꺼내는 게 더 귀찮았잖아요.']};
  return{kind:'생활용품',dna:'반복되는 생활 불편을 짧은 행동 하나로 줄이는 실사용 도구',strength:'사용 직후 눈에 보이는 변화',problem:'매번 반복되지만 참고 넘기던 생활 속 불편',buyer:'광고 설명보다 실제 사용 장면을 보고 결정하는 사람',psychology:'내 생활에서도 정말 자주 쓰게 될지 확인하고 싶다',proof:'사용 전 불편과 사용 후 반응의 차이',scenes:['문제가 생긴 실제 생활 장면','제품을 처음 사용하는 손동작 중심 장면','결과를 확인하고 표정이 바뀌는 장면'],hooks:['잠깐. 이거 쓰는 순간부터 보셔야 돼요.','와... 왜 다들 이 장면을 보여주는지 알겠네요.','아니, 설명 말고 결과만 볼게요. 진짜 달라지나?']}}
function salesStrategy(info){return{onePoint:info.strength,angle:`${info.problem}을 ${info.strength}으로 해결`,emotion:['놀람','호기심','공감','체험','감탄','확신','구매욕'],voice:VOICE_LOCK,cta:['왜 계속 품절되는지 이제 알겠네요.','이건 필요해진 다음 찾으면 늦겠는데요?','진작 썼으면 이 불편을 계속 참지는 않았을 것 같아요.']}}
function performancePlan(info){return{camera:['문제 장면 클로즈업',info.proof,'제품과 얼굴 또는 손을 번갈아 촬영','마지막 결과 장면 정지'],acting:['첫 장면은 당황한 표정','제품이 닿거나 작동할 때 0.3초 멈춤','결과를 확인한 뒤 자연스러운 감탄','마지막 문장은 카메라를 보며 확신 있게'],caption:['잠깐','딱 이 순간','표정 보이세요?','왜 품절인지 알겠네'],sound:['첫 컷 짧은 팝 효과','제품 작동 순간 클릭 또는 쿨링 효과','결과 장면에서 음악 한 박자 멈춤']}}
function revenueScore(text,info){let score=58;const shortLines=text.split('\n').filter(Boolean).filter(x=>x.length<=18).length;score+=Math.min(shortLines,10);if(/[와헉어잠깐아니진짜대박]/.test(text))score+=8;if(text.includes(info.strength.split(' ')[0]))score+=6;if(/표정|닿|순간|보이/.test(text))score+=7;if(/품절|늦|진작|놓치/.test(text))score+=6;if(!FORBIDDEN.some(x=>text.includes(x)))score+=5;return Math.min(99,score)}
function buildScripts(name,info,shift=0){const strategy=salesStrategy(info),plan=performancePlan(info),h=info.hooks,cta=strategy.cta;const scripts=[
{label:'가장 추천',body:`${h[(0+shift)%h.length]}\n\n[표정: 놀람 / 빠르게]\n보이세요?\n지금 ${info.problem}.\n\n[카메라: 문제 장면 클로즈업]\n여기.\n딱.\n\n[0.3초 멈춤]\n와...\n이 느낌은 말로 설명하면 안 돼요.\n${info.proof}.\n\n[속삭이듯]\n저도 처음엔 다 비슷한 줄 알았거든요.\n근데 ${info.strength}.\n어? 이건 다르네.\n\n[카메라를 보며]\n${cta[(0+shift)%cta.length]}\n\n[자막] ${plan.caption.join(' → ')}\n[효과음] ${plan.sound.join(' / ')}`},
{label:'상황 공감형',body:`잠깐...\n이 상황 익숙하시죠?\n${info.problem}.\n\n참고 넘기려고 했는데\n또 생겨요.\n계속.\n\n[제품 등장]\n그래서 여기.\n${info.strength}.\n\n딱 써보는 순간...\n와.\n이래서 필요한 거였네요.\n\n기능이 많아서가 아니에요.\n내가 제일 불편한 순간을\n바로 바꿔주니까요.\n\n${cta[(1+shift)%cta.length]}\n\n[Voice] ${VOICE_LOCK.name} / 빠르고 자연스럽게 / 광고처럼 읽지 않기`},
{label:'빠른 쇼츠형',body:`잠깐.\n보이세요?\n여기.\n딱.\n\n와...\n표정 바뀌었죠?\n\n${info.problem}.\n이걸\n${info.strength}으로\n바로 바꿉니다.\n\n아니...\n이 정도였어?\n\n설명은 됐고\n이 장면 하나면 끝이에요.\n\n${cta[(2+shift)%cta.length]}\n\n[촬영] ${plan.camera.join(' → ')}`},
{label:'실사용 후기형',body:`저도 처음엔\n"다 비슷하지" 했거든요.\n\n근데 써보니까...\n잠깐.\n이건 다시 보여드릴게요.\n\n${info.proof}.\n\n와...\n진짜네.\n\n제가 계속 손이 가는 이유는 하나예요.\n${info.strength}.\n\n거창한 설명보다\n내가 불편할 때 바로 쓰게 되는 것.\n그게 결국 남더라고요.\n\n${cta[(0+shift)%cta.length]}`},
{label:'비교 전환형',body:`잠깐만요.\n숫자 비교하기 전에\n이 장면부터 보세요.\n\n비슷해 보여도\n사람이 돈을 쓰는 이유는\n스펙표에 없거든요.\n\n${info.problem}.\n그 순간에\n${info.strength}.\n\n닿거나 작동하는 순간...\n와.\n반응부터 달라지죠?\n\n저라면 기능 열 개보다\n이 한 장면을 고르겠어요.\n\n${cta[(1+shift)%cta.length]}`}
];return scripts.map(x=>{const text=cleanScript(x.body);return{label:x.label,text,score:revenueScore(text,info),voice:VOICE_LOCK.name}})}
const steps=['상품 리서치','핵심 강점 발견','구매 심리 분석','판매 전략 수립','영상 장면 설계','화자·표정·톤·속도 결정','자막·효과음 설계','쇼핑 쇼츠 대본 생성','구매 전환 점검'];
async function make(){const name=$('#productInput').value.trim();if(!name){say('상품명이나 링크를 입력하세요.');return}state.product=name;$('#progress').classList.add('show');$('#resultWrap').classList.remove('show');$('#progressList').innerHTML=steps.map((x,i)=>`<div class="progress-item" data-step="${i}"><i class="dot"></i>${x}</div>`).join('');for(let i=0;i<steps.length;i++){const items=$$('.progress-item');items.forEach((x,j)=>x.className='progress-item'+(j<i?' done':j===i?' active':''));await new Promise(r=>setTimeout(r,210))}$$('.progress-item').forEach(x=>x.className='progress-item done');const info=productResearch(name),strategy=salesStrategy(info),plan=performancePlan(info);state.analysis={info,strategy,plan};state.scripts=buildScripts(name,info,0);state.active=state.scripts.reduce((best,x,i,a)=>x.score>a[best].score?i:best,0);$('#productTitle').textContent=name;$('#productSummary').textContent=`상품 DNA: ${info.dna} · 핵심 강점: ${info.strength} · 구매 심리: ${info.psychology} · 기본 화자: ${VOICE_LOCK.name}`;$('#sceneList').innerHTML=[`판매 포인트: ${strategy.onePoint}`,`구매 상황: ${info.problem}`,...info.scenes].map(x=>`<div class="scene">${esc(x)}</div>`).join('');renderScripts();$('#resultWrap').classList.add('show');say('판매 대본을 완성했습니다.')}
function renderScripts(){const tabs=$('#scriptTabs');tabs.innerHTML=state.scripts.map((s,i)=>`<button class="tab ${i===state.active?'active':''}" data-tab="${i}">${s.label}</button>`).join('');const current=state.scripts[state.active];$('#scriptLabel').textContent=`${current.label} · ${current.voice}`;$('#revenueScore').textContent=`Revenue Score ${current.score}점`;$('#scriptText').value=current.text;$$('[data-tab]').forEach(b=>b.onclick=()=>{state.scripts[state.active].text=cleanScript($('#scriptText').value);state.active=+b.dataset.tab;renderScripts()})}
function store(){return JSON.parse(localStorage.getItem('itemStudioSaved')||'[]')}
function save(){if(!state.scripts.length){say('먼저 대본을 만드세요.');return}state.scripts[state.active].text=cleanScript($('#scriptText').value);const arr=store();arr.unshift({id:Date.now(),product:state.product,scripts:state.scripts,analysis:state.analysis,date:new Date().toLocaleString('ko-KR')});localStorage.setItem('itemStudioSaved',JSON.stringify(arr.slice(0,50)));say('저장했습니다.')}
function renderSaved(){const arr=store(),root=$('#savedList');root.innerHTML=arr.length?arr.map((x,i)=>`<div class="saved-item" data-load="${i}"><strong>${esc(x.product)}</strong><small>${x.date} · 판매 대본 ${x.scripts.length}개</small></div>`).join(''):'<div class="empty">저장한 콘텐츠가 없습니다.</div>';$$('[data-load]').forEach(x=>x.onclick=()=>{const p=arr[+x.dataset.load];state.product=p.product;state.scripts=p.scripts;state.analysis=p.analysis||null;state.active=0;$('#productInput').value=p.product;$('#productTitle').textContent=p.product;$('#productSummary').textContent='저장해 둔 판매 대본을 다시 불러왔습니다.';$('#sceneList').innerHTML='';renderScripts();$('#resultWrap').classList.add('show');openScreen('make');say('저장한 콘텐츠를 불러왔습니다.')})}
function openScreen(id){$$('.screen').forEach(x=>x.classList.toggle('active',x.id===id));$$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.screen===id));$('#pageTitle').textContent=id==='make'?'새 콘텐츠 만들기':'저장한 콘텐츠';$('#pageDesc').textContent=id==='make'?'상품명이나 상품 링크만 입력하세요.':'필요한 판매 대본을 다시 불러올 수 있습니다.';if(id==='saved')renderSaved()}
$$('.nav button').forEach(b=>b.onclick=()=>openScreen(b.dataset.screen));$('#makeBtn').onclick=make;$('#productInput').onkeydown=e=>{if(e.key==='Enter')make()};$('#copyBtn').onclick=()=>{const cleaned=cleanScript($('#scriptText').value);$('#scriptText').value=cleaned;navigator.clipboard.writeText(cleaned).then(()=>say('판매 대본을 복사했습니다.'))};$('#saveBtn').onclick=save;$('#changeBtn').onclick=()=>{if(!state.product)return;const info=state.analysis?.info||productResearch(state.product),shift=Math.floor(Math.random()*3);state.scripts=buildScripts(state.product,info,shift);state.active=state.scripts.reduce((best,x,i,a)=>x.score>a[best].score?i:best,0);renderScripts();say('다른 판매 흐름으로 다시 만들었습니다.')};
</script>
