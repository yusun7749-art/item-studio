<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAVEN Autonomous CEO</title><style>body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#eef2ff}header{padding:20px 28px;border-bottom:1px solid #26304f;display:flex;justify-content:space-between;gap:16px;align-items:center}a{color:#9cc1ff}.wrap{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#151c31;border:1px solid #2a3559;border-radius:16px;padding:18px}.big{font-size:28px;font-weight:700}.muted{color:#9da9c9}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,input{padding:10px 12px;border-radius:9px;border:1px solid #39466d;background:#0f1628;color:#fff}button{cursor:pointer;background:#315fae}.proposal{padding:14px;border-radius:12px;background:#10172a;margin:10px 0}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#26365f;margin-right:6px;font-size:12px}.danger{background:#7b2940}.ok{background:#245d49}@media(max-width:760px){.row{grid-template-columns:1fr}}</style></head><body><header><div><strong>HAVEN Autonomous CEO</strong><div class="muted">재무·업무 데이터를 읽고 다음 수익 과제를 제안합니다.</div></div><nav><a href="finance-center.html">Finance</a> · <a href="brain-center.html">Brain</a> · <a href="index.html">HQ</a></nav></header><main class="wrap"><section id="metrics" class="grid"></section><section class="row"><div class="card"><h2>자율 운영 설정</h2><div class="actions"><label><input id="enabled" type="checkbox"> 기능 활성화</label><label><input id="autoCreate" type="checkbox"> 제안 즉시 미션 생성</label><input id="maxDaily" type="number" min="1" max="10" placeholder="회당 최대 미션"><button id="saveSettings">설정 저장</button></div><p class="muted">현재 정적 GitHub Pages 구조에서는 브라우저가 열려 있을 때 또는 버튼을 눌렀을 때 실행됩니다. 외부 서버 스케줄러 연결 전에는 24시간 백그라운드 실행이 아닙니다.</p><div class="actions"><button id="analyze">CEO 분석 실행</button><button id="analyzeCreate">분석 후 미션 생성</button></div></div><div class="card"><h2>최근 사이클</h2><div id="cycles"></div></div></section><section class="card" style="margin-top:16px"><h2>CEO 제안함</h2><div id="proposals"></div></section></main><script src="company-brain.js"></script><script src="finance-engine.js"></script><script src="mission-engine.js"></script><script src="autonomous-ceo.js"></script><script>const won=n=>new Intl.NumberFormat('ko-KR').format(Number(n)||0)+'원';function render(){const A=window.HavenAutonomousCEO,s=A.summary(),st=A.getState();metrics.innerHTML=[['활성 상태',s.enabled?'ON':'OFF'],['자동 생성',s.autoCreate?'ON':'OFF'],['열린 제안',s.openProposals],['생성 미션',s.createdMissions],['실행 사이클',s.totalCycles],['최근 실행',s.lastCycleAt?new Date(s.lastCycleAt).toLocaleString():'없음']].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="big">${x[1]}</div></div>`).join('');enabled.checked=st.settings.enabled;autoCreate.checked=st.settings.autoCreate;maxDaily.value=st.settings.maxDailyMissions;cycles.innerHTML=st.cycles.slice(0,8).map(x=>`<div class="proposal"><strong>${new Date(x.at).toLocaleString()}</strong><div class="muted">제안 ${x.proposalCount}건 · 미션 ${x.missionCount}건 · 수익 ${won(x.metrics.revenue)} · ROI ${x.metrics.roi}%</div></div>`).join('')||'<p class="muted">아직 실행 기록이 없습니다.</p>';proposals.innerHTML=st.proposals.map(p=>`<div class="proposal"><div><span class="tag">${p.division}</span><span class="tag">${p.priority}</span><span class="tag ${p.status==='REJECTED'?'danger':p.status==='MISSION_CREATED'?'ok':''}">${p.status}</span></div><h3>${p.title}</h3><div class="muted">${p.reason} · 예상 영향 ${won(p.estimatedImpact)}</div>${p.missionId?`<p>미션: ${p.missionId}</p>`:''}<div class="actions">${p.status==='PROPOSED'?`<button onclick="approve('${p.id}')">미션 생성</button><button onclick="rejectP('${p.id}')">보류</button>`:''}</div></div>`).join('')||'<p class="muted">CEO 분석을 실행하면 제안이 생성됩니다.</p>'}function approve(id){window.HavenAutonomousCEO.approveProposal(id);render()}function rejectP(id){window.HavenAutonomousCEO.rejectProposal(id,'대표 보류');render()}saveSettings.onclick=()=>{window.HavenAutonomousCEO.setSettings({enabled:enabled.checked,autoCreate:autoCreate.checked,maxDailyMissions:maxDaily.value});render()};analyze.onclick=()=>{window.HavenAutonomousCEO.runCycle({createMissions:false});render()};analyzeCreate.onclick=()=>{window.HavenAutonomousCEO.runCycle({createMissions:true});render()};render();</script></body></html>
