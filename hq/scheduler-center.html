<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAVEN Scheduler Center</title><style>:root{--bg:#06101d;--panel:#0d1b2d;--line:#203750;--text:#f4f7fb;--muted:#91a4b8;--cyan:#35d3c7;--green:#35c77a;--yellow:#f4c85b;--red:#ff6b72}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#17304c,#06101d 42%);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}main{max-width:1280px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.top h1{margin:0}.top p,.muted{color:var(--muted)}a,button,input,select{font:inherit}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer;text-decoration:none}.primary{background:linear-gradient(90deg,var(--cyan),#67a7ff);color:#04131d}.secondary{background:#1a3048;color:#dce8f3}.danger{background:rgba(255,107,114,.14);color:#ff9ba0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.two{display:grid;grid-template-columns:.8fr 1.2fr;gap:16px;margin-top:16px}.card{background:linear-gradient(145deg,#11243a,#091a2b);border:1px solid var(--line);border-radius:17px;padding:18px}.card h2{font-size:17px;margin:0 0 14px}.metric span{font-size:12px;color:var(--muted)}.metric strong{display:block;font-size:27px;margin-top:8px}.field{display:grid;gap:6px;margin-top:10px}.field label{font-size:11px;color:var(--muted);font-weight:800}.field input,.field select{background:#071626;color:#fff;border:1px solid var(--line);border-radius:11px;padding:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{display:grid;gap:9px}.item{background:#081827;border:1px solid var(--line);border-radius:12px;padding:13px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-size:10px;border-radius:999px;padding:5px 8px;background:rgba(53,211,199,.12);color:var(--cyan)}.badge.off{background:rgba(255,107,114,.12);color:#ff9ba0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.mini{padding:7px 9px;font-size:11px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:520px){.grid,.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}main{padding:18px 12px}}</style></head><body><main><header class="top"><div><h1>⏱ HAVEN Scheduler Center</h1><p>반복 업무를 등록하고 Job Queue로 자동 전달합니다.</p></div><div><a class="btn secondary" href="brain-center.html">Brain Center</a> <a class="btn secondary" href="./">HQ</a></div></header><section class="grid"><div class="card metric"><span>전체 일정</span><strong id="total">0</strong></div><div class="card metric"><span>활성 일정</span><strong id="enabled">0</strong></div><div class="card metric"><span>현재 실행 대상</span><strong id="due">0</strong></div><div class="card metric"><span>누적 실행</span><strong id="runs">0</strong></div></section><section class="two"><div class="card"><h2>자동 업무 등록</h2><div class="field"><label>업무명</label><input id="task" placeholder="예: Savingio 승인 상태 점검"></div><div class="row"><div class="field"><label>사업부</label><select id="division"><option>Savingio</option><option>ITEM Studio</option><option>공통 본부</option></select></div><div class="field"><label>우선순위</label><select id="priority"><option>긴급</option><option selected>높음</option><option>보통</option></select></div></div><div class="row"><div class="field"><label>반복</label><select id="frequency"><option value="DAILY">매일</option><option value="WEEKLY">매주</option><option value="MONTHLY">매월</option></select></div><div class="field"><label>실행 시각</label><input id="time" type="time" value="09:00"></div></div><div class="actions"><button class="btn primary" id="addBtn">일정 등록</button><button class="btn secondary" id="dueBtn">실행 대상 Queue 등록</button></div></div><div class="card"><h2>등록된 일정</h2><div id="items" class="list"></div></div></section><section class="card" style="margin-top:16px"><h2>최근 실행 기록</h2><div id="history" class="list"></div></section><script src="scheduler-engine.js"></script><script>const S=window.HavenScheduler,$=id=>document.getElementById(id),fmt=v=>new Date(v).toLocaleString('ko-KR');function render(){const x=S.summary(),st=S.getState();$('total').textContent=x.total;$('enabled').textContent=x.enabled;$('due').textContent=x.due;$('runs').textContent=x.runs;$('items').innerHTML=st.items.map(i=>`<div class="item"><div class="head"><strong>${i.title}</strong><span class="badge ${i.enabled?'':'off'}">${i.enabled?'ACTIVE':'OFF'}</span></div><p class="muted">${i.division} · ${i.priority} · ${i.frequency}<br>다음 실행 ${fmt(i.nextRunAt)}</p><div class="actions"><button class="btn secondary mini" onclick="runNow('${i.id}')">지금 실행</button><button class="btn secondary mini" onclick="toggleItem('${i.id}')">${i.enabled?'중지':'재개'}</button><button class="btn danger mini" onclick="removeItem('${i.id}')">삭제</button></div></div>`).join('')||'<div class="muted">등록된 일정이 없습니다.</div>';$('history').innerHTML=st.runs.slice(0,20).map(r=>`<div class="item"><div class="head"><strong>${r.title}</strong><span class="badge">${r.status}</span></div><p class="muted">${fmt(r.at)} · Job ${r.jobId}</p></div>`).join('')||'<div class="muted">실행 기록이 없습니다.</div>'}window.runNow=id=>{S.runNow(id);render()};window.toggleItem=id=>{S.toggle(id);render()};window.removeItem=id=>{S.remove(id);render()};$('addBtn').onclick=()=>{try{S.add({title:$('task').value,division:$('division').value,priority:$('priority').value,frequency:$('frequency').value,time:$('time').value});$('task').value='';render()}catch(e){alert(e.message)}};$('dueBtn').onclick=()=>{const jobs=S.runDue();alert(`${jobs.length}건을 Job Queue에 등록했습니다.`);render()};render();</script></main></body></html>
