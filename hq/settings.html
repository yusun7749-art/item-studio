<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAVEN AI 연결 설정</title><style>:root{--bg:#06101d;--panel:#0d1b2d;--line:#203750;--text:#f4f7fb;--muted:#91a4b8;--cyan:#35d3c7;--green:#35c77a;--red:#ff6b72}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#17304c,#06101d 42%);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif;min-height:100vh}.wrap{max-width:760px;margin:50px auto;padding:0 18px}.card{background:rgba(13,27,45,.97);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.25)}h1{margin:0 0 8px}p{color:var(--muted);line-height:1.6}.field{margin-top:16px}label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:7px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#071626;color:#fff}button,a{border:0;border-radius:11px;padding:11px 14px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:linear-gradient(90deg,var(--cyan),#66a6ff);color:#04131d}.secondary{background:#1a3048;color:#d8e4ef}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.status{margin-top:16px;padding:13px;border-radius:12px;background:#071626;border:1px solid var(--line);color:var(--muted);white-space:pre-wrap}.ok{color:#8ff0b7}.bad{color:#ff9ba0}.notice{font-size:12px;background:rgba(53,211,199,.09);border:1px solid rgba(53,211,199,.25);padding:13px;border-radius:12px;margin-top:18px}</style></head><body><main class="wrap"><section class="card"><h1>AI Connector 설정</h1><p>HAVEN HQ가 Cloudflare Worker 실행 엔진을 호출하도록 연결합니다. OpenAI API 키는 이 화면이나 GitHub에 저장하지 않고 Worker Secret에만 보관합니다.</p><div class="field"><label>Worker API 주소</label><input id="endpoint" placeholder="https://haven-ai-execution-engine.계정.workers.dev"></div><div class="field"><label>HAVEN Access Token</label><input id="token" type="password" placeholder="Worker에 등록한 접근 토큰"></div><div class="actions"><button class="primary" id="save">설정 저장</button><button class="secondary" id="test">연결 테스트</button><a class="secondary" href="./">HQ로 돌아가기</a></div><div id="status" class="status">아직 연결을 확인하지 않았습니다.</div><div class="notice">필요한 Worker Secret: <b>OPENAI_API_KEY</b>, <b>HAVEN_ACCESS_TOKEN</b>. 토큰은 현재 브라우저의 localStorage에만 저장됩니다.</div></section></main><script src="ai-connector.js"></script><script>const c=window.HavenAIConnector,$=id=>document.getElementById(id),cfg=c.getConfig();$('endpoint').value=cfg.endpoint||'';$('token').value=cfg.accessToken||'';$('save').onclick=()=>{c.save({endpoint:$('endpoint').value.trim(),accessToken:$('token').value.trim()});$('status').innerHTML='<span class="ok">설정을 저장했습니다.</span>'};$('test').onclick=async()=>{c.save({endpoint:$('endpoint').value.trim(),accessToken:$('token').value.trim()});$('status').textContent='연결 확인 중...';const r=await c.health();$('status').innerHTML=r.ok?`<span class="ok">연결 성공\n상태: ${r.status||'READY'}\nProvider: ${r.provider||'-'}\nModel: ${r.model||'-'}</span>`:`<span class="bad">연결 실패\n${r.error||r.status||'확인 필요'}</span>`};</script></body></html>
