<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAVEN Brain Center</title>
<style>
:root{--bg:#06101d;--panel:#0d1b2d;--line:#203750;--text:#f4f7fb;--muted:#91a4b8;--cyan:#35d3c7;--green:#35c77a;--yellow:#f4c85b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#17304c,#06101d 42%);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}main{max-width:1280px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.top h1{margin:0}.top p,.muted{color:var(--muted)}a,button{font:inherit}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer;text-decoration:none}.primary{background:linear-gradient(90deg,var(--cyan),#67a7ff);color:#04131d}.secondary{background:#1a3048;color:#dce8f3}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.card{background:linear-gradient(145deg,#11243a,#091a2b);border:1px solid var(--line);border-radius:17px;padding:18px}.card h2{font-size:17px;margin:0 0 14px}.metric span{font-size:12px;color:var(--muted)}.metric strong{display:block;font-size:27px;margin-top:8px}.field{display:grid;gap:6px;margin-top:10px}.field label{font-size:11px;color:var(--muted);font-weight:800}.field input{background:#071626;color:#fff;border:1px solid var(--line);border-radius:11px;padding:12px}.list{display:grid;gap:9px}.item{background:#081827;border:1px solid var(--line);border-radius:12px;padding:13px}.head{display:flex;justify-content:space-between;gap:10px}.badge{font-size:10px;border-radius:999px;padding:5px 8px;background:rgba(53,211,199,.12);color:var(--cyan)}.bar{height:7px;background:#20344a;border-radius:99px;overflow:hidden;margin-top:9px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#67a7ff)}.output{white-space:pre-wrap;line-height:1.6;color:#cbd8e5;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}main{padding:18px 12px}}
</style></head><body><main><header class="top"><div><h1>🧠 HAVEN Brain Center</h1><p>수익 목표, 사업 점수, Job Queue, CEO 보고를 관리합니다.</p></div><div><a class="btn secondary" href="./">HQ로 돌아가기</a></div></header>
<section class="grid"><div class="card metric"><span>활성 수익 목표</span><strong id="goal">0원</strong></div><div class="card metric"><span>분석 결정</span><strong id="decisions">0</strong></div><div class="card metric"><span>학습 패턴</span><strong id="patterns">0</strong></div><div class="card metric"><span>실행 대기</span><strong id="queued">0</strong></div></section>
<section class="two"><div class="card"><h2>월 수익 목표 설정</h2><div class="field"><label>목표 금액</label><input id="amount" type="number" min="0" step="10000" value="5000000"></div><div class="actions"><button class="btn primary" id="goalBtn">목표 저장·계획 생성</button><button class="btn secondary" id="reportBtn">CEO 보고 새로 만들기</button></div><div id="plan" class="output" style="margin-top:14px"></div></div><div class="card"><h2>오늘의 CEO 보고</h2><div id="report" class="output">보고를 생성해 주세요.</div></div></section>
<section class="two"><div class="card"><h2>사업 우선순위</h2><div id="businesses" class="list"></div></div><div class="card"><h2>Job Queue</h2><div class="actions"><button class="btn secondary" id="retryBtn">실패 작업 재시도 등록</button></div><div id="jobs" class="list" style="margin-top:12px"></div></div></section>
<script src="company-brain.js"></script><script>
const B=window.HavenCompanyBrain,$=id=>document.getElementById(id),won=n=>Number(n||0).toLocaleString('ko-KR')+'원';
function companyState(){try{return JSON.parse(localStorage.getItem('haven_ai_company_v5')||'{}')}catch{return{}}}
function render(){const m=B.getMemory(),q=B.getQueue(),g=B.activeGoal();$('goal').textContent=won(g?.target);$('decisions').textContent=m.decisions.length;$('patterns').textContent=m.patterns.length;$('queued').textContent=q.jobs.filter(x=>['QUEUED','RETRY','RUNNING'].includes(x.status)).length;$('businesses').innerHTML=B.businessScores().map(x=>`<div class="item"><div class="head"><strong>${x.name}</strong><span class="badge">SCORE ${x.score}</span></div><p class="muted">수익성 ${x.revenue} · 속도 ${x.speed} · 난이도 ${x.difficulty} · 위험 ${x.risk} · 승인률 ${x.approvalRate}%</p><div class="bar"><span style="width:${x.score}%"></span></div></div>`).join('');$('jobs').innerHTML=q.jobs.slice(0,20).map(x=>`<div class="item"><div class="head"><strong>${x.title}</strong><span class="badge">${x.status}</span></div><p class="muted">${x.division||''} · ${x.priority} · 시도 ${x.attempts||0}회</p></div>`).join('')||'<div class="muted">등록된 작업이 없습니다.</div>'}
function showPlan(p){$('plan').textContent=`목표 ${won(p.target)}\n현재 ${won(p.current)}\n부족액 ${won(p.gap)}\n\n`+p.allocations.map(x=>`${x.division}: ${won(x.amount)} · ${x.feasible?'수용 가능':'목표 조정 필요'}\n${x.action}`).join('\n\n')}
function showReport(r){$('report').textContent=`생성: ${new Date(r.at).toLocaleString('ko-KR')}\n미션 ${r.metrics.missions}건 · 승인 ${r.metrics.approved}건 · 반려 ${r.metrics.rejected}건\n승인 대기 ${r.metrics.pending}건 · Queue ${r.metrics.queued}건\n승인률 ${r.metrics.approvalRate}%\n\n추천\n${r.recommendations.map(x=>'• '+x).join('\n')||'• 현재 긴급 권고 없음'}`;if(r.revenuePlan)showPlan(r.revenuePlan)}
$('goalBtn').onclick=()=>{const g=B.setRevenueGoal($('amount').value);const p=B.buildRevenuePlan(g.target,0);showPlan(p);render()};$('reportBtn').onclick=()=>{showReport(B.createCEOReport(companyState()));render()};$('retryBtn').onclick=()=>{B.retryFailed();render()};render();const last=B.getMemory().reports[0];if(last)showReport(last);
</script></main></body></html>
