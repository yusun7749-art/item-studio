<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAVEN AI Router Center</title><style>:root{--bg:#06101d;--panel:#0d1b2d;--line:#203750;--text:#f4f7fb;--muted:#91a4b8;--cyan:#35d3c7;--green:#35c77a;--red:#ff6b72}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#17304c,#06101d 42%);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}main{max-width:1280px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.top h1{margin:0}.top p,.muted{color:var(--muted)}a,button,select{font:inherit}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer;text-decoration:none}.secondary{background:#1a3048;color:#dce8f3}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.two{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px;margin-top:16px}.card{background:linear-gradient(145deg,#11243a,#091a2b);border:1px solid var(--line);border-radius:17px;padding:18px}.card h2{font-size:17px;margin:0 0 14px}.metric span{font-size:12px;color:var(--muted)}.metric strong{display:block;font-size:27px;margin-top:8px}.item{background:#081827;border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:9px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-size:10px;border-radius:999px;padding:5px 8px;background:rgba(53,211,199,.12);color:var(--cyan)}.badge.off{background:rgba(255,107,114,.12);color:#ff9ba0}.bar{height:7px;background:#20344a;border-radius:99px;overflow:hidden;margin-top:9px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#67a7ff)}.field{display:grid;gap:6px}.field label{font-size:11px;color:var(--muted);font-weight:800}.field select{background:#071626;color:#fff;border:1px solid var(--line);border-radius:11px;padding:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.mini{padding:7px 9px;font-size:11px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}main{padding:18px 12px}}</style></head><body><main><header class="top"><div><h1>🔀 HAVEN AI Router Center</h1><p>업무 유형에 따라 가장 적합한 AI를 자동 선택합니다.</p></div><div><a class="btn secondary" href="brain-center.html">Brain Center</a> <a class="btn secondary" href="./">HQ</a></div></header><section class="grid"><div class="card metric"><span>활성 AI</span><strong id="enabled">0</strong></div><div class="card metric"><span>라우팅 결정</span><strong id="decisions">0</strong></div><div class="card metric"><span>규칙 엔진 전환</span><strong id="fallbacks">0</strong></div><div class="card metric"><span>현재 전략</span><strong id="strategy">-</strong></div></section><section class="two"><div class="card"><h2>라우팅 전략</h2><div class="field"><label>우선 기준</label><select id="strategySelect"><option value="balanced">균형</option><option value="quality">품질 우선</option><option value="speed">속도 우선</option><option value="cost">비용 우선</option></select></div><div class="actions"><button class="btn secondary" id="saveStrategy">전략 저장</button></div><h2 style="margin-top:24px">AI 공급자</h2><div id="providers"></div></div><div class="card"><h2>최근 자동 선택 기록</h2><div id="routes"></div></div></section><script src="ai-router.js"></script><script>const R=window.HavenAIRouter,$=id=>document.getElementById(id);function render(){const s=R.getState(),m=R.summary();$('enabled').textContent=m.enabled;$('decisions').textContent=m.decisions;$('fallbacks').textContent=m.fallbacks;$('strategy').textContent=m.strategy;$('strategySelect').value=s.strategy;$('providers').innerHTML=Object.entries(s.providers).map(([k,p])=>`<div class="item"><div class="head"><strong>${p.label}</strong><span class="badge ${p.enabled?'':'off'}">${p.enabled?'ACTIVE':'OFF'}</span></div><p class="muted">${p.models.join(' · ')}<br>품질 ${p.quality} · 속도 ${p.speed} · 비용 ${p.cost}</p><div class="bar"><span style="width:${p.quality}%"></span></div><div class="actions"><button class="btn secondary mini" onclick="toggleProvider('${k}',${!p.enabled})">${p.enabled?'중지':'활성화'}</button></div></div>`).join('');$('routes').innerHTML=s.routes.slice(0,25).map(x=>`<div class="item"><div class="head"><strong>${x.type} → ${x.chosen.label}</strong><span class="badge">${x.chosen.model}</span></div><p class="muted">점수 ${x.chosen.score} · 전략 ${x.strategy}<br>${new Date(x.at).toLocaleString('ko-KR')}</p></div>`).join('')||'<div class="muted">아직 라우팅 기록이 없습니다.</div>'}window.toggleProvider=(k,v)=>{R.updateProvider(k,{enabled:v});render()};$('saveStrategy').onclick=()=>{R.setStrategy($('strategySelect').value);render()};render();</script></main></body></html>
