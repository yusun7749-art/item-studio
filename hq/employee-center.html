<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAVEN Employee Center</title><style>:root{--bg:#06101d;--panel:#0d1b2d;--line:#203750;--text:#f4f7fb;--muted:#91a4b8;--cyan:#35d3c7;--green:#35c77a;--yellow:#f4c85b;--red:#ff6b72}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#17304c,#06101d 42%);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}main{max-width:1380px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.top h1{margin:0}.top p,.muted{color:var(--muted)}a,button,input,select{font:inherit}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer;text-decoration:none}.primary{background:linear-gradient(90deg,var(--cyan),#67a7ff);color:#04131d}.secondary{background:#1a3048;color:#dce8f3}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:18px}.card{background:linear-gradient(145deg,#11243a,#091a2b);border:1px solid var(--line);border-radius:17px;padding:18px}.metric span{font-size:12px;color:var(--muted)}.metric strong{display:block;font-size:27px;margin-top:8px}.employees{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.employee{background:#081827;border:1px solid var(--line);border-radius:14px;padding:15px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-size:10px;border-radius:999px;padding:5px 8px;background:rgba(53,211,199,.12);color:var(--cyan)}.badge.work{background:rgba(244,200,91,.12);color:var(--yellow)}.badge.pause{background:rgba(255,107,114,.12);color:#ff9ba0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#0d2033;border-radius:10px;padding:9px}.stat span{font-size:10px;color:var(--muted)}.stat strong{display:block;margin-top:4px}.bar{height:7px;background:#20344a;border-radius:99px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#67a7ff)}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.list{display:grid;gap:9px}.item{background:#081827;border:1px solid var(--line);border-radius:12px;padding:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.mini{padding:7px 9px;font-size:11px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.employees{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.grid,.employees,.two{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}main{padding:18px 12px}}</style></head><body><main><header class="top"><div><h1>👥 HAVEN Employee Center</h1><p>AI 직원 배정, 성과, 품질, 처리속도를 관리합니다.</p></div><div><a class="btn secondary" href="ai-router-center.html">AI Router</a> <a class="btn secondary" href="brain-center.html">Brain Center</a> <a class="btn secondary" href="./">HQ</a></div></header><section class="grid"><div class="card metric"><span>전체 직원</span><strong id="total">0</strong></div><div class="card metric"><span>업무 중</span><strong id="working">0</strong></div><div class="card metric"><span>대기</span><strong id="idle">0</strong></div><div class="card metric"><span>완료 업무</span><strong id="completed">0</strong></div><div class="card metric"><span>평균 품질</span><strong id="quality">0</strong></div></section><section id="employees" class="employees"></section><section class="two"><div class="card"><h2>최근 업무 배정</h2><div id="assignments" class="list"></div></div><div class="card"><h2>조직 활동 기록</h2><div id="events" class="list"></div></div></section><script src="employee-engine.js"></script><script>const A=window.HavenEmployeeAI,$=id=>document.getElementById(id),fmt=v=>v?new Date(v).toLocaleString('ko-KR'):'기록 없음',ms=v=>v?`${(v/1000).toFixed(1)}초`:'0초';function badge(s){return s==='WORKING'?'work':s==='PAUSED'?'pause':''}function render(){const s=A.getState(),x=A.summary();$('total').textContent=x.total;$('working').textContent=x.working;$('idle').textContent=x.idle;$('completed').textContent=x.completed;$('quality').textContent=Math.round(x.averageQuality);$('employees').innerHTML=s.employees.map(e=>{const q=A.averageQuality(e),avg=A.averageMs(e),rate=(e.completed+e.failed)?Math.round(e.completed/(e.completed+e.failed)*100):0;return `<div class="employee"><div class="head"><div><strong>${e.name}</strong><div class="muted" style="font-size:11px;margin-top:4px">${e.department} · ${e.role}</div></div><span class="badge ${badge(e.status)}">${e.status}</span></div><p class="muted" style="font-size:12px">전문: ${e.skills.join(', ')}<br>모델: ${e.model}<br>최근 활동: ${fmt(e.lastActiveAt)}</p><div class="stats"><div class="stat"><span>완료</span><strong>${e.completed}</strong></div><div class="stat"><span>성공률</span><strong>${rate}%</strong></div><div class="stat"><span>평균속도</span><strong>${ms(avg)}</strong></div></div><div class="bar"><span style="width:${q}%"></span></div><p class="muted" style="font-size:11px">평균 품질 ${q}점 · 실패 ${e.failed}건</p><div class="actions"><button class="btn secondary mini" onclick="setStatus('${e.id}','IDLE')">대기</button><button class="btn secondary mini" onclick="setStatus('${e.id}','PAUSED')">휴식</button></div></div>`}).join('');$('assignments').innerHTML=s.assignments.slice(0,20).map(a=>`<div class="item"><div class="head"><strong>${a.employeeName}</strong><span class="badge ${a.status==='WORKING'?'work':''}">${a.status}</span></div><p class="muted">${a.taskId} · ${a.skill}<br>${fmt(a.startedAt)}${a.completedAt?' → '+fmt(a.completedAt):''}<br>품질 ${a.quality??'-'} · ${a.provider||'대기'} ${a.model||''}</p></div>`).join('')||'<div class="muted">업무 배정 기록이 없습니다.</div>';$('events').innerHTML=s.events.slice(0,20).map(e=>`<div class="item"><div class="head"><strong>${e.type}</strong><span class="badge">${fmt(e.at)}</span></div><p class="muted">${e.message}</p></div>`).join('')||'<div class="muted">활동 기록이 없습니다.</div>'}window.setStatus=(id,status)=>{A.setStatus(id,status);render()};render();setInterval(render,5000);</script></main></body></html>
