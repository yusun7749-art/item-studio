<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAVEN Finance Center</title><style>body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#eef2ff}header{padding:20px 28px;border-bottom:1px solid #26304f;display:flex;justify-content:space-between;align-items:center}a{color:#9cc1ff}.wrap{padding:24px;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#151c31;border:1px solid #2a3559;border-radius:16px;padding:18px}.big{font-size:28px;font-weight:700;margin-top:8px}.muted{color:#9da9c9}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.business{margin:10px 0;padding:14px;border-radius:12px;background:#10172a}.bar{height:9px;background:#28314c;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#6fa8ff}.actions{display:flex;gap:8px;flex-wrap:wrap}input,select,button{padding:10px 12px;border-radius:9px;border:1px solid #39466d;background:#0f1628;color:#fff}button{cursor:pointer;background:#315fae}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #28314c;text-align:left}@media(max-width:760px){.row{grid-template-columns:1fr}}</style></head><body><header><div><strong>HAVEN Finance Center</strong><div class="muted">사업부 목표·수익·비용·ROI</div></div><nav><a href="brain-center.html">Brain</a> · <a href="employee-center.html">Employee</a> · <a href="index.html">HQ</a></nav></header><main class="wrap"><section id="metrics" class="grid"></section><section class="row"><div class="card"><h2>사업부 실적</h2><div id="businesses"></div></div><div class="card"><h2>목표 설정</h2><div class="actions"><select id="division"><option>Savingio</option><option>ITEM Studio</option><option>공통 본부</option></select><input id="goal" type="number" placeholder="월 목표 금액"><button id="saveGoal">저장</button></div><h2>수익·비용 직접 기록</h2><div class="actions"><select id="type"><option value="REVENUE">수익</option><option value="COST">비용</option></select><input id="amount" type="number" placeholder="금액"><input id="note" placeholder="메모"><button id="addTx">기록</button></div><h2>Brain 투자 판단</h2><div id="recommend"></div></div></section><section class="card" style="margin-top:16px"><h2>미션 재무 현황</h2><div style="overflow:auto"><table class="table"><thead><tr><th>미션</th><th>사업부</th><th>상태</th><th>예상수익</th><th>실제수익</th><th>비용</th><th>ROI</th></tr></thead><tbody id="missions"></tbody></table></div></section></main><script src="finance-engine.js"></script><script>const won=n=>new Intl.NumberFormat('ko-KR',{style:'currency',currency:'KRW',maximumFractionDigits:0}).format(Number(n)||0);function render(){const F=window.HavenFinance,s=F.summary();metrics.innerHTML=[['월 목표',won(s.goal)],['현재 수익',won(s.revenue)],['총 비용',won(s.cost)],['순이익',won(s.profit)],['달성률',s.achievement+'%'],['ROI',s.roi+'%']].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="big">${x[1]}</div></div>`).join('');businesses.innerHTML=s.businesses.map(x=>`<div class="business"><strong>${x.division}</strong><div class="muted">${won(x.revenue)} / ${won(x.goal)} · 비용 ${won(x.cost)} · ROI ${x.roi}%</div><div class="bar"><i style="width:${Math.min(100,x.achievement)}%"></i></div></div>`).join('');recommend.innerHTML=F.recommendations().map(x=>`<div class="business"><strong>${x.division}</strong> · ${x.action}<div class="muted">ROI ${x.roi}% · 순이익 ${won(x.profit)}</div></div>`).join('');missions.innerHTML=F.getState().missions.map(x=>`<tr><td>${x.title}</td><td>${x.division}</td><td>${x.status}</td><td>${won(x.estimatedRevenue)}</td><td>${won(x.actualRevenue)}</td><td>${won(x.cost)}</td><td>${x.roi}%</td></tr>`).join('')||'<tr><td colspan="7" class="muted">아직 기록된 미션이 없습니다.</td></tr>'}saveGoal.onclick=()=>{window.HavenFinance.setBusinessGoal(division.value,goal.value);render()};addTx.onclick=()=>{window.HavenFinance.addTransaction({division:division.value,type:type.value,amount:amount.value,note:note.value});amount.value='';note.value='';render()};render();</script></body></html>
